<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rogue Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@1,800;1,600&family=Saira:wght@500&display=swap">
<style>
:root{
  --void:#02030a; --deep:#06123a; --flame:#1f5bff; --glow:#5aa8ff; --ice:#cfe6ff; --steel:#8a97ad;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--void);color:var(--ice);overflow:hidden;font-family:"Saira",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--void);z-index:10}
#stage{position:relative;width:100%;height:100%;background:radial-gradient(ellipse at 50% 70%,#0a1a55 0%,var(--void) 65%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(to bottom,transparent,rgba(31,91,255,.18));border-top:1px solid rgba(90,168,255,.25)}
.flash{position:absolute;left:0;right:0;top:46%;height:2px;background:linear-gradient(90deg,transparent,var(--ice) 50%,transparent);box-shadow:0 0 24px 6px var(--glow);opacity:0;transform:scaleX(0);animation:flash 1s .25s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scaleX(0)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.1)}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vh,18px);padding-bottom:6vh}
svg.mark{width:clamp(110px,26vmin,260px);overflow:visible;filter:drop-shadow(0 0 14px rgba(70,140,255,.85)) drop-shadow(0 0 40px rgba(31,91,255,.6));opacity:0;animation:markIn .9s .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes markIn{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:scale(1)}}
.mark .edge{fill:none;stroke:var(--glow);stroke-width:3;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.1s .9s ease-out forwards}
.mark .body{opacity:0;animation:fade .6s 1.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.word{margin:0;text-align:center;line-height:.9;font-family:"Saira Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;opacity:0;animation:wordIn .8s 1.9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wordIn{from{opacity:0;letter-spacing:.4em;filter:blur(8px)}to{opacity:1;letter-spacing:.02em;filter:blur(0)}}
.word .a{display:block;font-size:clamp(44px,13vmin,130px);background:linear-gradient(#fff 0%,#c4cfe0 45%,#6d7a92 55%,#d9e3f2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #020617) drop-shadow(0 0 12px rgba(90,168,255,.35))}
.word .b{display:block;font-size:clamp(22px,6.4vmin,62px);font-weight:600;color:var(--ice);letter-spacing:.32em;text-shadow:0 0 10px var(--flame),0 0 26px var(--flame);margin-top:.15em}
.load{width:min(64vw,420px);margin-top:clamp(8px,3vh,28px);opacity:0;animation:fade .6s 2.5s forwards}
.track{height:10px;border:1px solid rgba(138,151,173,.6);background:rgba(2,3,10,.7);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding:2px}
.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--flame),var(--glow) 80%,#fff);box-shadow:0 0 12px var(--glow);transition:width .25s linear}
.status{margin-top:10px;text-align:center;font-size:clamp(12px,2.2vmin,16px);letter-spacing:.12em;color:var(--steel);min-height:1.2em}
.status.ready{color:var(--ice);text-shadow:0 0 10px var(--flame)}
.out #stage .center{animation:none}
.hint{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:100%;text-align:center;font-size:12px;color:rgba(138,151,173,.7);opacity:0;transition:opacity .6s}
.out .hint{opacity:1}
@media (prefers-reduced-motion:reduce){
  .flash{display:none}
  svg.mark,.word,.load,.mark .body{animation-duration:.01s;animation-delay:0s}
  .mark .edge{animation:none;stroke-dashoffset:0}
}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Rogue Player loading screen">
  <canvas id="fx"></canvas>
  <div class="floor"></div>
  <div class="flash"></div>
  <div class="center">
    <svg class="mark" viewBox="0 0 200 160" aria-hidden="true">
      <defs>
        <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f8ff"/><stop offset=".45" stop-color="#9fb0cc"/>
          <stop offset=".55" stop-color="#4b5870"/><stop offset="1" stop-color="#b9c8e2"/>
        </linearGradient>
      </defs>
      <path class="body" fill="url(#chrome)" fill-rule="evenodd" d="M30 140 L58 20 L150 20 L172 36 L161 74 L132 88 L172 140 L134 140 L108 94 L90 94 L76 140 Z M90 48 L126 48 L133 54 L129 68 L123 72 L83 72 Z"/>
      <path class="edge" d="M30 140 L58 20 L150 20 L172 36 L161 74 L132 88 L172 140 L134 140 L108 94 L90 94 L76 140 Z"/>
    </svg>
    <h1 class="word"><span class="a">ROGUE</span><span class="b">PLAYER</span></h1>
    <div class="load" aria-live="polite">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="status" id="status">Starting up…</div>
    </div>
  </div>
  <div class="hint">Tap to replay</div>
</div>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('fx'), cx = cv.getContext('2d');
  var W,H,DPR,P=[],S=[],t0=performance.now(), intensity=1;

  function size(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize',size); size();

  // Flame tongues rise from two clusters at the lower left and right; smoke drifts above.
  function spawn(){
    var side=Math.random()<.5?-1:1, base=side<0?W*.14:W*.86;
    P.push({x:base+(Math.random()-.5)*W*.2,y:H*.9,vx:0,vy:-(.6+Math.random()*1.4),
      r:(18+Math.random()*34)*(H/600+.5),life:0,max:60+Math.random()*60,ph:Math.random()*6.28,side:side});
    if(Math.random()<.35) S.push({x:base+(Math.random()-.5)*W*.3,y:H*.8,r:50+Math.random()*90,life:0,max:200+Math.random()*120,ph:Math.random()*6.28,side:side});
  }

  function frame(now){
    var t=(now-t0)/1000;
    cx.globalCompositeOperation='source-over';
    cx.clearRect(0,0,W,H);
    var ramp=reduce?1:Math.min(1,t/1.2)*intensity;   // flames ignite over the first second

    // smoke
    cx.globalCompositeOperation='lighter';
    for(var i=S.length-1;i>=0;i--){
      var s=S[i]; s.life++; s.y-=.35; s.x+=Math.sin(s.life*.02+s.ph)*.5+s.side*-.1;
      var k=s.life/s.max; if(k>=1){S.splice(i,1);continue}
      var a=Math.sin(k*Math.PI)*.06*ramp, g=cx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*(1+k));
      g.addColorStop(0,'rgba(60,100,230,'+a+')'); g.addColorStop(1,'rgba(10,20,80,0)');
      cx.fillStyle=g; cx.fillRect(s.x-s.r*2,s.y-s.r*2,s.r*4,s.r*4);
    }
    // flames
    if(!reduce||P.length<90) for(var n=0;n<(reduce?0:Math.ceil(3*ramp));n++) spawn();
    for(var j=P.length-1;j>=0;j--){
      var p=P[j]; p.life++; var k2=p.life/p.max;
      if(k2>=1){P.splice(j,1);continue}
      p.vx+=Math.sin(p.life*.09+p.ph)*.06 - p.side*.006*(1-k2); p.x+=p.vx; p.y+=p.vy*(1-k2*.4);
      var rr=p.r*(1-k2*.7), al=(1-k2)*.5*ramp;
      var gg=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);
      gg.addColorStop(0,'rgba(190,225,255,'+al+')');
      gg.addColorStop(.35,'rgba(60,130,255,'+al*.8+')');
      gg.addColorStop(1,'rgba(10,30,160,0)');
      cx.fillStyle=gg; cx.beginPath(); cx.arc(p.x,p.y,rr,0,6.283); cx.fill();
    }
    // floor reflection glow
    var fg=cx.createLinearGradient(0,H*.86,0,H);
    fg.addColorStop(0,'rgba(31,91,255,'+.16*ramp+')'); fg.addColorStop(1,'rgba(31,91,255,0)');
    cx.fillStyle=fg; cx.fillRect(0,H*.86,W,H*.14);
    requestAnimationFrame(frame);
  }
  if(reduce){for(var i=0;i<140;i++){spawn();P[P.length-1].life=Math.random()*60}}
  requestAnimationFrame(frame);

  // ---- Loading hooks for the real app ----
  var fill=document.getElementById('fill'), status=document.getElementById('status'), shown=0, finished=false, timer=null;
  var steps=[[0,'Starting up…'],[.3,'Loading playlists…'],[.6,'Fetching channels…'],[.85,'Almost there…']];
  function label(p){var l=steps[0][1];steps.forEach(function(s){if(p>=s[0])l=s[1]});return l}

  // setProgress(0..1, optionalLabel): call this from the app as real work completes.
  function setProgress(p,text){
    if(finished)return; shown=Math.max(shown,Math.min(1,p));
    fill.style.width=(shown*100)+'%'; status.textContent=text||label(shown);
  }
  // done(): call when the app is ready; fills the bar and shows the welcome state.
  function done(cb){
    if(finished)return; finished=true; clearInterval(timer);
    fill.style.width='100%'; status.textContent='Welcome'; status.classList.add('ready');
    document.body.classList.add('out');
    setTimeout(function(){ if(typeof cb==='function')cb(); document.dispatchEvent(new CustomEvent('rogueplayer:ready')); },900);
  }
  function reset(){
    finished=false; shown=0; fill.style.width='0%'; status.className='status'; status.textContent='Starting up…';
    document.body.classList.remove('out'); demo();
  }
  // Demo loader so the page works on its own. Remove demo() when wiring to a real app.
  function demo(){
    var start=performance.now()+2600;  // wait for the logo reveal
    clearInterval(timer);
    timer=setInterval(function(){
      var e=(performance.now()-start)/1000; if(e<0)return;
      var p=Math.min(1,1-Math.pow(1-e/3.6,2.2)); setProgress(p);
      if(e>3.6)done();
    },120);
  }
  window.RoguePlayerSplash={setProgress:setProgress,done:done,reset:reset};
  demo();

  // Replay by tapping after it finishes: restart the CSS sequence in place.
  function replay(){
    var els=document.querySelectorAll('.flash,.mark,.mark .edge,.mark .body,.word,.load');
    els.forEach(function(e){e.style.animation='none'}); void document.body.offsetWidth; els.forEach(function(e){e.style.animation=''});
    t0=performance.now(); P.length=0; S.length=0; reset();
  }
  document.getElementById('stage').addEventListener('click',function(){ if(finished)replay(); });
})();
</script>
</body>
</html>
