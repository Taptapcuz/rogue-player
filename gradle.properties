org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8
android.useAndroidX=true
# Rewrites the legacy aauto-sdk AAR's android.support.* references to androidx
# (only the `legacy` flavor links that SDK; the rewrite is build-time only).
android.enableJetifier=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=false
